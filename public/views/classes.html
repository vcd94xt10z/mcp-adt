<section id="classesPage" class="app-page d-none">
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div><h2 class="h5 mb-1">Classes</h2><p class="text-secondary mb-0">Pesquise, crie, altere, ative e exclua classes ABAP.</p></div>
                <button id="newClass" class="btn btn-primary" type="button">Nova classe</button>
            </div>
            <div class="card bg-body-tertiary border mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-7"><label class="form-label" for="classSearchQuery">Padrão do nome</label><input id="classSearchQuery" class="form-control" value="ZCL*" placeholder="ZCL* ou *TESTE*"></div><div class="col-md-2"><label class="form-label" for="classSearchMax">Máx.</label><input id="classSearchMax" class="form-control" type="number" min="1" max="500" value="100"></div><div class="col-md-3 d-grid"><button id="classSearch" class="btn btn-primary" type="button">Pesquisar</button></div></div></div></div>
            <div id="classResults" class="table-responsive"><div class="alert alert-secondary">Informe o padrão e clique em Pesquisar.</div></div>
        </div>
    </div>

    <div class="modal fade" id="classModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable resizable-modal">
            <form id="classForm" class="modal-content">
                <div class="modal-header"><h5 id="classFormTitle" class="modal-title">Nova classe</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Nome *</label><input id="className" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Descrição *</label><input id="classDescription" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Pacote *</label><div class="input-group"><input id="classPackage" class="form-control" required><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="package">Selecionar</button></div></div>
                        <div class="col-md-4"><label class="form-label">Request Workbench</label><div class="input-group"><input id="classTransport" class="form-control"><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="request">Selecionar</button></div></div>
                        <div class="col-md-4"><label class="form-label">Idioma</label><div class="input-group"><input id="classLanguage" class="form-control" value="EN"><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="language">Selecionar</button></div></div>
                        <div class="col-md-4"><label class="form-label">Visibilidade</label><select id="classVisibility" class="form-select"><option value="public">Public</option><option value="protected">Protected</option><option value="private">Private</option></select></div>
                        <div class="col-12"><div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label mb-0">Código fonte</label><button id="classGenerateSkeleton" class="btn btn-outline-primary btn-sm" type="button">Gerar esboço</button></div><textarea id="classSource" class="form-control class-source" rows="18" spellcheck="false"></textarea></div>
                    </div>
                </div>
                <div class="modal-footer"><div class="me-auto d-flex gap-2"><button id="classCheckSyntax" class="btn btn-outline-primary" type="button">Verificar sintaxe</button><button id="classActivate" class="btn btn-success" type="button">Ativar</button></div><button id="classSubmit" class="btn btn-primary" type="submit">Salvar</button><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button></div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="classDeleteModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar exclusão</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p id="classDeleteText"></p><label class="form-label">Request Workbench</label><div class="input-group"><input id="classDeleteTransport" class="form-control"><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="delete-request">Selecionar</button></div></div><div class="modal-footer"><button id="classDeleteConfirm" class="btn btn-danger" type="button">Excluir</button><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button></div></div></div></div>

    <div class="modal fade" id="classSyntaxModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Verificação de sintaxe - <span id="classSyntaxName"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="classSyntaxSummary" class="alert mb-3"></div><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Tipo</th><th>Linha</th><th>Coluna</th><th>Mensagem</th></tr></thead><tbody id="classSyntaxMessages"></tbody></table></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Fechar</button></div></div></div></div>
</section>
