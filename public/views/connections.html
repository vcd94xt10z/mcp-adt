<section id="connectionsPage" class="app-page d-none">
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div>
                    <h2 class="h5 mb-1">Conexões SAP</h2>
                    <p class="text-secondary mb-0">Gerencie as conexões usadas pela interface e pelo MCP.</p>
                </div>
                <div class="d-flex gap-2">
                    <button id="newConnection" class="btn btn-primary" type="button">Nova conexão</button>
                    <button id="reloadConnections" class="btn btn-outline-secondary" type="button">Recarregar</button>
                </div>
            </div>
            <div class="alert alert-info">As alterações são gravadas diretamente em <strong>connections.json</strong>. A senha fica no próprio arquivo.</div>
            <div id="connectionList" class="table-responsive"></div>
        </div>
    </div>

    <div class="modal fade" id="connectionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <form id="connectionForm" class="modal-content">
                <div class="modal-header">
                    <h5 id="connectionFormTitle" class="modal-title">Nova conexão</h5>
                    <button id="closeConnectionModal" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6"><label for="connName" class="form-label">Nome</label><input id="connName" class="form-control" placeholder="DEV" required></div>
                        <div class="col-md-6"><label for="connUrl" class="form-label">URL</label><input id="connUrl" class="form-control" placeholder="http://sap:50000" required></div>
                        <div class="col-md-6"><label for="connClient" class="form-label">Client</label><input id="connClient" class="form-control" placeholder="001" required></div>
                        <div class="col-md-6"><label for="connUser" class="form-label">Usuário</label><input id="connUser" class="form-control" placeholder="DEVELOPER" required></div>
                        <div class="col-md-6"><label for="connPassword" class="form-label">Senha</label><input id="connPassword" type="password" class="form-control" autocomplete="new-password"></div>
                        <div class="col-md-6"><label for="connLanguage" class="form-label">Idioma</label><input id="connLanguage" class="form-control" placeholder="EN"></div>
                        <div class="col-12 form-check ms-2"><input id="connRejectUnauthorized" class="form-check-input" type="checkbox"><label for="connRejectUnauthorized" class="form-check-label">Rejeitar certificados TLS inválidos</label></div>
                    </div>
                    <div class="form-text mt-3">Ao editar, deixe a senha vazia para manter a senha atual.</div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <button id="cancelConnection" class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="deleteConnectionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Excluir conexão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    Deseja realmente excluir a conexão <strong id="deleteConnectionName"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="confirmDeleteConnection" type="button" class="btn btn-danger">Excluir</button>
                </div>
            </div>
        </div>
    </div>
</section>
