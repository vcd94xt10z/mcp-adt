<section id="interfacesPage" class="app-page d-none">
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div><h2 class="h5 mb-1">Interfaces</h2><p class="text-secondary mb-0">Pesquise, crie, altere, ative e exclua interfaces ABAP.</p></div>
                <button id="newInterface" class="btn btn-primary" type="button">Nova interface</button>
            </div>
            <div class="card bg-body-tertiary border mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-7"><label class="form-label" for="interfaceSearchQuery">Padrão do nome</label><input id="interfaceSearchQuery" class="form-control" value="ZIF*" placeholder="ZIF* ou *TESTE*"></div><div class="col-md-2"><label class="form-label" for="interfaceSearchMax">Máx.</label><input id="interfaceSearchMax" class="form-control" type="number" min="1" max="500" value="100"></div><div class="col-md-3 d-grid"><button id="interfaceSearch" class="btn btn-primary" type="button">Pesquisar</button></div></div></div></div>
            <div id="interfaceResults" class="table-responsive"><div class="alert alert-secondary">Informe o padrão e clique em Pesquisar.</div></div>
        </div>
    </div>

    <div class="modal fade" id="interfaceModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable resizable-modal">
            <form id="interfaceForm" class="modal-content">
                <div class="modal-header"><h5 id="interfaceFormTitle" class="modal-title">Nova interface</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Nome *</label><input id="interfaceName" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Descrição *</label><input id="interfaceDescription" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Pacote *</label><div class="input-group"><input id="interfacePackage" class="form-control" required><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="package">Selecionar</button></div></div>
                        <div class="col-md-4"><label class="form-label">Request Workbench</label><div class="input-group"><input id="interfaceTransport" class="form-control"><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="request">Selecionar</button></div></div>
                        <div class="col-md-4"><label class="form-label">Idioma</label><div class="input-group"><input id="interfaceLanguage" class="form-control" value="EN"><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="language">Selecionar</button></div></div>
                        <div class="col-md-4"><label class="form-label">Visibilidade</label><select id="interfaceVisibility" class="form-select"><option value="public">Public</option><option value="protected">Protected</option><option value="private">Private</option></select></div>
                        <div class="col-12"><div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label mb-0">Código fonte</label><button id="interfaceGenerateSkeleton" class="btn btn-outline-primary btn-sm" type="button">Gerar esboço</button></div><textarea id="interfaceSource" class="form-control interface-source" rows="18" spellcheck="false"></textarea></div>
                    </div>
                </div>
                <div class="modal-footer"><div class="me-auto d-flex gap-2"><button id="interfaceCheckSyntax" class="btn btn-outline-primary" type="button">Verificar sintaxe</button><button id="interfaceActivate" class="btn btn-success" type="button">Ativar</button></div><button id="interfaceSubmit" class="btn btn-primary" type="submit">Salvar</button><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Fechar</button></div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="interfaceDeleteModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar exclusão</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p id="interfaceDeleteText"></p><label class="form-label">Request Workbench</label><div class="input-group"><input id="interfaceDeleteTransport" class="form-control"><button class="btn btn-outline-secondary value-help-button" type="button" data-value-help="delete-request">Selecionar</button></div></div><div class="modal-footer"><button id="interfaceDeleteConfirm" class="btn btn-danger" type="button">Excluir</button><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button></div></div></div></div>

    <div class="modal fade" id="interfaceSyntaxModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Verificação de sintaxe - <span id="interfaceSyntaxName"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="interfaceSyntaxSummary" class="alert mb-3"></div><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Tipo</th><th>Linha</th><th>Coluna</th><th>Mensagem</th></tr></thead><tbody id="interfaceSyntaxMessages"></tbody></table></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Fechar</button></div></div></div></div>
</section>
